version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: microscopy_postgres
    restart: always
    environment:
      POSTGRES_USER: microscopy
      POSTGRES_PASSWORD: microscopy
      POSTGRES_DB: microscopy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: microscopy_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: microscopy
      MINIO_ROOT_PASSWORD: microscopy123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  # (опционально)
  # api:
  #   build: ../src/api/
  #   container_name: microscopy_api
  #   depends_on:
  #     - postgres
  #     - minio
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgres://microscopy:microscopy@postgres:5432/microscopy_db
  #     MINIO_ENDPOINT: minio:9000
  #     MINIO_ACCESS_KEY: microscopy
  #     MINIO_SECRET_KEY: microscopy123

volumes:
  postgres_data:
  minio_data:
