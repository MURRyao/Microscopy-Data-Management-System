version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: microscopy_postgres
    restart: always
    environment:
      POSTGRES_USER: microscopy
      POSTGRES_PASSWORD: microscopy
      POSTGRES_DB: airflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microscopy -d airflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - all_in_one

  minio:
    # Pin to a specific release for reproducibility.
    # Check https://hub.docker.com/r/minio/minio/tags for the latest stable release.
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: microscopy_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: microscopy
      MINIO_ROOT_PASSWORD: microscopy123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - all_in_one

  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 microscopy microscopy123; do
        echo 'Waiting for MinIO...';
        sleep 5;
      done;

      mc mb -p local/testbucket || true;
      mc anonymous set download local/testbucket || true;
      "
    networks:
      - all_in_one

  airflow-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://microscopy:microscopy@postgres/airflow_db
    # Set AIRFLOW_ADMIN_PASSWORD in a .env file or environment before starting.
    command: >
      bash -c "airflow db upgrade && airflow users create
        --username admin
        --password ${AIRFLOW_ADMIN_PASSWORD:-changeme}
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    networks:
      - all_in_one

  airflow-webserver:
    build: .
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://microscopy:microscopy@postgres/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./config/logs:/opt/airflow/logs
      - ./config/plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - all_in_one

  airflow-scheduler:
    build: .
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://microscopy:microscopy@postgres/airflow_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./config/logs:/opt/airflow/logs
      - ./config/plugins:/opt/airflow/plugins
    command: scheduler
    networks:
      - all_in_one

volumes:
  postgres_data:
  minio_data:

networks:
  all_in_one:
    driver: bridge
