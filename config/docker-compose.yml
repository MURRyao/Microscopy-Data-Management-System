version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: microscopy_postgres
    restart: always
    environment:
      POSTGRES_USER: microscopy
      POSTGRES_PASSWORD: microscopy
      POSTGRES_DB: airflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    container_name: microscopy_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: microscopy
      MINIO_ROOT_PASSWORD: microscopy123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  airflow-init:
    build: .
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://microscopy:microscopy@postgres/airflow_db
    command: >
      bash -c "airflow db upgrade && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  airflow-webserver:
    build: .
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://microscopy:microscopy@postgres/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags     
      - ./config/logs:/opt/airflow/logs       
      - ./config/plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build: .
    depends_on:
      - airflow-webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://microscopy:microscopy@postgres/airflow_db
    volumes:
      - ./airflow/dags:/opt/airflow/dags      
      - ./config/logs:/opt/airflow/logs       
      - ./config/plugins:/opt/airflow/plugins
    command: scheduler 

volumes:
  postgres_data:
  minio_data:
